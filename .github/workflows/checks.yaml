name: Verify Philly
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --group test
      - run: uv run pytest tests -n 4
      - run: uv run poe all
      - run: uv build && uv run python scripts/check_distribution.py
      - run: git diff --exit-code
  mcp-and-site:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: http://127.0.0.1:4321
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: npm ci
        working-directory: mcp
      - run: npm run catalog:check
        working-directory: mcp
      - run: npm run format:check && npm run check && npm test
        working-directory: mcp
      - run: bun install --frozen-lockfile && bun run build
        working-directory: website
      - run: npm run build && npm run test:workerd && npm run benchmark
        working-directory: mcp
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: mcp
      - run: npm run test:browser
        working-directory: mcp
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-previews
          path: mcp/test-results/
