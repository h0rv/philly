name: Public MCP diagnosis
on:
  push:
    branches: ['feat/public-mcp-diagnosis']
permissions:
  contents: read
jobs:
  public-client:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
        working-directory: mcp
      - run: PHL_PUBLIC_TEST=1 node --experimental-strip-types scripts/public-mcp-smoke.ts
        working-directory: mcp
