[project]
name = "philly"
version = "0.1.0"
description = "Python library and CLI for OpenDataPhilly datasets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["philadelphia", "open-data", "civic-data", "geospatial", "pandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "fire>=0.7.1",
    "geojson>=3.2.0",
    "geoparquet>=0.0.3",
    "gtfs-realtime-bindings>=1.0.0",
    "geopandas>=1.1.0",
    "httpx>=0.28.1",
    "pandas>=2.3.0",
    "pydantic>=2.11.3",
    "pyyaml>=6.0.2",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "pyarrow>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>0",
    "ty>0",
    "poethepoet>=0.37.0",
    "scipy>=1.16.3",
]
test = ["pytest>0", "pytest-asyncio>0"]
notebook = [
    "catppuccin-jupyterlab>=0.2.4",
    "duckdb>=1.0.0",
    "ipykernel>0",
    "jupyterlab>0",
    "jupyterlab-vim>=4.1.4",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
]

[project.scripts]
phl = "philly.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"philly" = ["datasets/*.yaml"]

[tool.poe.tasks]
fmt = "uv run ruff format"
lint = "uv run ruff check --fix"
type-check = "uv run ty check src"
test = "uv run pytest tests"

all = ["fmt", "lint", "type-check"]

[tool.poe.tasks.site-install]
shell = "cd website && bun install"
help = "Install website dependencies with Bun"

[tool.poe.tasks.site-sync]
shell = "cd website && bun run sync:explorations"
help = "Sync publishable exploration artifacts into the website"

[tool.poe.tasks.site-dev]
shell = "cd website && bun run dev"
help = "Run the Astro website locally"

[tool.poe.tasks.site-build]
shell = "cd website && bun run build"
help = "Build the Astro website for GitHub Pages"

[tool.poe.tasks.site-preview]
shell = "cd website && bun run preview"
help = "Preview the built Astro website"

[tool.poe.tasks.eval-ui]
cmd = "python -m http.server 8800 --directory explorations"
help = "Serve explorations UI at http://localhost:8800"

[tool.pyright]
include = ["src"]
