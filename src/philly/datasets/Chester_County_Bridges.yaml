notes: Bridges in Chester County -- this dataset is primarily derived from PennDOT's
  Bridge Management System (BMS). Full attribution from BMS is available for state-owned
  bridges greater than 8 feet in length and locally-owned bridges greater than 20
  feet in length. Additional bridges are added for planning purposes, such as bridges
  listed on a state Bridge Bill or within the Chester County Planning Commission's
  Transportation Improvement Inventory.
