notes: 'This dataset contains information about eCLIPSE permit documents of the three
  following types: certificates of occupancy, variances, and denials. The document
  link field takes users to the documents themselves. Variances are only available
  when related to completed permits that were initially denied by the Board of Building
  Standards (BBS) or Plumbing Advisory Board (PAB). Similarly, denial documents are
  only available for BBS or PAB denials related to completed permits.'
