notes: A web application to explore parking violation trends across Philadelphia during
  that time. Data ranges from 2012 to 2017 and is presented on a monthly basis. The
  dashboard includes the number of tickets, total revenue, most common ticket locations,
  tickets by hour, tickets by zip code, hourly ticket by weekday, ticket density map,
  and summaries of types of tickets and issuing agencies.
