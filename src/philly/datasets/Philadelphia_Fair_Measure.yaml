notes: Fair Measure is an independent research project that compares City of Philadelphia
  real estate assessments against an independent estimate of the property value based
  on the same public records that the City uses. The data is based on actual property
  sales, City property records, City licenses and inspections data, and public mapping
  data. The web site also include guidance on how to file for an appeal of your property
  assessment.
