notes: 'SEPTA Metro route-level real-time trips API used by the official SEPTA real-time
  map. Returns active trips for Metro services and includes latitude/longitude when
  GPS is available. Known route IDs include L1 (Market-Frankford Line), B1/B2/B3
  (Broad Street Line local/express/spur), and M1 (Norristown High Speed Line).
  Some Metro routes may return trips with status NO GPS and null coordinates even
  when service is active.

  Example: https://www3.septa.org/api/v2/trips/?route_id=L1'
