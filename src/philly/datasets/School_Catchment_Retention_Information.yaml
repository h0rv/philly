  \ for each school for students enrolled on October 1 of that year. Data reflects\
  \ students\u2019 last recorded address in the District\u2019s student information\
  \ system at the time of the enrollment snapshot. Catchment retention counts are\
  \ grouped by school or by catchment area for students enrolled on October 1 of that\
  \ year."
